<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Overflow guard — negative control</title>
<style>
  :root { --page-w: 210mm; --page-h: 297mm; }
  html[data-profile="print"][data-paper="a4"]        { --page-w: 210mm;  --page-h: 297mm;  }
  html[data-profile="print"][data-paper="letter"]    { --page-w: 8.5in;  --page-h: 11in;   }
  html[data-profile="tablet"][data-paper="portrait"] { --page-w: 1620px; --page-h: 2160px; }
  html { font-size: calc(var(--page-w) / 65); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; }
  [data-page] { width: var(--page-w); height: var(--page-h); overflow: hidden; padding: 4rem; background: #faf6f0; }
  .row { height: 4rem; border-bottom: 1px solid #d9d0c4; font-size: 1.4rem; line-height: 4rem; }
</style>
</head>
<body>
  <!-- This page deliberately holds far more rows than fit. It exists so the
       renderer's overflow guard can be proven to FAIL, rather than assumed. -->
  <section data-page="deliberately-too-tall">
    <div class="row">1</div><div class="row">2</div><div class="row">3</div><div class="row">4</div>
    <div class="row">5</div><div class="row">6</div><div class="row">7</div><div class="row">8</div>
    <div class="row">9</div><div class="row">10</div><div class="row">11</div><div class="row">12</div>
    <div class="row">13</div><div class="row">14</div><div class="row">15</div><div class="row">16</div>
    <div class="row">17</div><div class="row">18</div><div class="row">19</div><div class="row">20</div>
    <div class="row">21</div><div class="row">22</div><div class="row">23</div><div class="row">24</div>
    <div class="row">25</div><div class="row">26</div><div class="row">27</div><div class="row">28</div>
  </section>
</body>
</html>
